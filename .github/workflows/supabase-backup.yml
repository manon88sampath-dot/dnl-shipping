name: DNL Shipping Supabase Backup

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Create backup directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backups

      - name: Create full PostgreSQL 17 backup
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is missing."
            exit 1
          fi

          stamp=$(date -u +%Y%m%d-%H%M%S)

          docker run --rm \
            -e DATABASE_URL="$SUPABASE_DB_URL" \
            -v "$PWD/backups:/backups" \
            postgres:17 \
            pg_dump "$DATABASE_URL" \
              --format=custom \
              --no-owner \
              --no-privileges \
              --schema=public \
              --schema=auth \
              --schema=storage \
              --file="/backups/dnl-shipping-full-${stamp}.dump"

          ls -lh backups/

      - name: Upload private backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnl-shipping-full-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: error
