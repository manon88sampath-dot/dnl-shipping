name: DNL Shipping Supabase Backup

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create full backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          stamp=$(date -u +%Y%m%d-%H%M%S)
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --schema=public \
            --schema=auth \
            --schema=storage \
            --file="backups/dnl-shipping-full-${stamp}.dump"

      - name: Upload private backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnl-shipping-full-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: error
