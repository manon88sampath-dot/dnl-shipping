name: DNL Shipping Supabase Backup

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release

          sudo install -d /usr/share/postgresql-common/pgdg

          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          pg_dump --version

      - name: Create full backup
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is missing."
            exit 1
          fi

          mkdir -p backups

          stamp=$(date -u +%Y%m%d-%H%M%S)

          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --schema=public \
            --schema=auth \
            --schema=storage \
            --file="backups/dnl-shipping-full-${stamp}.dump"

          ls -lh backups/

      - name: Upload private backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnl-shipping-full-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: error
